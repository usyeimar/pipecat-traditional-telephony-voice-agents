[general]
static = yes
writeprotect = yes

[phones]
; 9000: the voice agent. Dialing a WebSocket channel opens a WebSocket to the bot (the
; "voice_agent" connection in websocket_client.conf) and bridges the call's audio to it.
;   c(slin)   16-bit PCM at 8 kHz, which is what the pipeline works with. Asterisk transcodes
;             from the phone's codec.
;   f(json)   control messages as JSON, which carries channel variables.
;   v(...)    extra URL parameters: the caller's number.
exten = 9000,1,NoOp(Voice agent for ${CALLERID(num)})
 same = n,Dial(WebSocket/voice_agent/c(slin)f(json)v(caller=${URIENCODE(${CALLERID(num)})}))
 same = n,Hangup()

; 9196: echo test, to check a softphone's audio without the bot.
exten = 9196,1,Answer()
 same = n,Echo()
 same = n,Hangup()
