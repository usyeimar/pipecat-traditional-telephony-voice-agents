; SIP for softphones. ${PLACEHOLDERS} are filled in by docker-entrypoint.sh.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:${ASTERISK_SIP_PORT}
; The container sits behind Docker's NAT: advertise the address phones can reach.
external_signaling_address = ${EXTERNAL_IP}
external_signaling_port = ${ASTERISK_SIP_PORT}
external_media_address = ${EXTERNAL_IP}

; --- Templates -------------------------------------------------------------------------------

[softphone](!)
type = endpoint
context = phones
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
direct_media = no
; Phones are always behind NAT from here: answer to where the packets came from.
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[softphone-auth](!)
type = auth
auth_type = userpass
password = ${SIP_PASSWORD}

[softphone-aor](!)
type = aor
max_contacts = 1
remove_existing = yes

; --- Accounts for testing: 1000 and 1001, password SIP_PASSWORD from .env ----------------------

[1000](softphone)
auth = 1000
aors = 1000
callerid = "Softphone 1000" <1000>

[1000](softphone-auth)
username = 1000

[1000](softphone-aor)

[1001](softphone)
auth = 1001
aors = 1001
callerid = "Softphone 1001" <1001>

[1001](softphone-auth)
username = 1001

[1001](softphone-aor)
