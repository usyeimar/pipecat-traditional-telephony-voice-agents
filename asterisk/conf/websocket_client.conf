; Outbound WebSocket connections. ${PLACEHOLDERS} are filled in by docker-entrypoint.sh.

[voice_agent]
type = websocket_client
; One connection per call, the only type chan_websocket supports for media.
connection_type = per_call_config
uri = ${ASTERISK_BOT_WS_URL}
protocols = media
; Sent as HTTP Basic credentials on the handshake; the bot checks the password against BOT_TOKEN.
; Use wss:// (tls_enabled = yes) or a private network: over ws:// they travel in clear text.
username = asterisk
password = ${BOT_TOKEN}
tls_enabled = no
connection_timeout = 1000
reconnect_interval = 500
reconnect_attempts = 3
