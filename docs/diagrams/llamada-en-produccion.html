<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una llamada en producción, del timbre al colgado</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Secuencia · Llamada entrante</p>
    <h1>Una llamada en producción, del timbre al colgado</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="llamada-en-produccion-title llamada-en-produccion-desc">
        <title id="llamada-en-produccion-title">Una llamada en producción, del timbre al colgado</title>
        <desc id="llamada-en-produccion-desc">Secuencia de una llamada entrante: el operador SIP entrega el INVITE a la centralita, que abre un WebSocket al bot; el bot saluda, conversa por turnos con los servicios de voz y LLM, descarta audio si lo interrumpen y cuelga tras la despedida.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <!-- Líneas de vida -->
        <line x1="120" y1="96" x2="120" y2="616" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="376" y1="96" x2="376" y2="616" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="632" y1="96" x2="632" y2="616" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="888" y1="96" x2="888" y2="616" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1150" y1="96" x2="1150" y2="616" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Fragmentos: el turno (loop) y la interrupción (opt) -->
        <rect x="92" y="288" width="1088" height="140" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="92" y="288" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="112" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="104" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[cada turno de la conversación]</text>

        <rect x="572" y="444" width="344" height="76" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="572" y="444" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="592" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="652" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[si quien llama habla encima del bot]</text>

        <!-- Barras de activación: la centralita y el bot sostienen la llamada -->
        <rect x="628" y="172" width="8" height="420" fill="#f5f5f5"/>
        <rect x="628" y="172" width="8" height="420" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="884" y="204" width="8" height="356" fill="#f5f5f5"/>
        <rect x="884" y="204" width="8" height="356" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Mensajes: el tiempo baja -->
        <line x1="120" y1="136" x2="376" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="376" y1="168" x2="628" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="636" y1="200" x2="884" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="892" y1="232" x2="1150" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="884" y1="264" x2="636" y2="264" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="636" y1="344" x2="884" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="892" y1="376" x2="1150" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="884" y1="408" x2="636" y2="408" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="628" y1="408" x2="120" y2="408" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="884" y1="500" x2="636" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="884" y1="556" x2="636" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="628" y1="588" x2="376" y2="588" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Etiquetas de mensaje -->
        <rect x="224" y="116" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="248" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LLAMADA</text>
        <rect x="464" y="148" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVITE/200 OK</text>
        <rect x="712" y="180" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WS + CREDENCIAL</text>
        <rect x="982" y="212" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1020" y="221" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SALUDO · TTS</text>
        <rect x="722" y="244" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIO SALUDO</text>
        <rect x="718" y="324" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="333" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIO LLAMANTE</text>
        <rect x="986" y="356" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1020" y="365" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STT→LLM→TTS</text>
        <rect x="720" y="388" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="397" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIO DEL BOT</text>
        <rect x="214" y="388" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="248" y="397" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOZ DEL BOT</text>
        <rect x="718" y="480" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="489" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DESCARTAR COLA</text>
        <rect x="740" y="536" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="545" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HANGUP</text>
        <rect x="490" y="568" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="577" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BYE</text>

        <!-- Nota editorial: el bot no cuelga a media despedida -->
        <path d="M 912,548 Q 902,548 894,552" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="894" cy="552" r="2" fill="#2d3142"/>
        <text x="920" y="552" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">antes espera a que termine</text>
        <text x="920" y="570" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">de sonar la despedida</text>

        <!-- Actores -->
        <rect x="40" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEL</text>
        <text x="120" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quien llama</text>
        <text x="120" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">red pública</text>
        <rect x="296" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="304" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="318" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="376" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operador SIP</text>
        <text x="376" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">troncal + número</text>
        <rect x="552" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="552" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="560" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="574" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PBX</text>
        <text x="632" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Centralita</text>
        <text x="632" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Asterisk o FreeSWITCH</text>
        <rect x="808" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="808" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="816" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="830" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOT</text>
        <text x="888" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bot Pipecat</text>
        <text x="888" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agente de voz</text>
        <rect x="1060" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1060" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="1068" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="1082" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="1150" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Servicios de voz y LLM</text>
        <text x="1150" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Deepgram · Claude · Cartesia</text>

        <!-- Leyenda -->
        <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>
        <rect x="44" y="680" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="60" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sostiene la llamada</text>
        <line x1="184" y1="690" x2="212" y2="690" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="220" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Mensaje</text>
        <line x1="284" y1="690" x2="312" y2="690" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="320" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada a API</text>
        <line x1="416" y1="690" x2="444" y2="690" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="452" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Audio de vuelta</text>
        <line x1="556" y1="690" x2="584" y2="690" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <rect x="748" y="684" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="768" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fragmento (loop / opt)</text>

      </svg>
    </div>
  </div>
</body>
</html>
