<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De la red pública al bot por una troncal SIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · Troncal SIP</p>
    <h1>De la red pública al bot por una troncal SIP</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="troncal-sip-title troncal-sip-desc">
        <title id="troncal-sip-title">De la red pública al bot por una troncal SIP</title>
        <desc id="troncal-sip-desc">Arquitectura de una llamada que entra por la troncal del operador SIP a Asterisk o FreeSWITCH y llega al bot Pipecat: Asterisk usa un solo WebSocket para audio y control; FreeSWITCH envía solo audio por WebSocket y el bot lo controla por ESL.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <!-- Zona: la centralita, una u otra (antes de flechas y nodos) -->
        <rect x="480" y="104" width="228" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="520" y="108" width="148" height="12" rx="2" fill="#f5f5f5"/>
        <text x="594" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TU CENTRALITA (UNA U OTRA)</text>

        <!-- Flechas (detrás de los nodos) -->
        <!-- Quien llama → Operador SIP -->
        <line x1="168" y1="284" x2="232" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Operador SIP → Asterisk / FreeSWITCH: dos puertos separados en el borde derecho -->
        <path d="M 376,272 H 448 Q 456,272 456,264 V 184 Q 456,176 464,176 H 504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 376,296 H 448 Q 456,296 456,304 V 384 Q 456,392 464,392 H 504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Asterisk → Bot: un solo WebSocket con audio y control -->
        <line x1="684" y1="176" x2="844" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- FreeSWITCH → Bot: WebSocket solo con el audio de quien llama -->
        <line x1="684" y1="372" x2="844" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Bot → FreeSWITCH: ESL, el segundo canal (acento) -->
        <line x1="844" y1="412" x2="684" y2="412" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Bot → Servicios de voz y LLM -->
        <line x1="1004" y1="284" x2="1060" y2="284" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Centralita → Agentes humanos (opcional) -->
        <line x1="594" y1="456" x2="594" y2="520" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Etiquetas de flecha -->
        <rect x="176" y="264" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="273" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LLAMADA</text>
        <rect x="390" y="218" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="418" y="227" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIP + RTP</text>
        <rect x="390" y="338" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="418" y="347" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIP + RTP</text>
        <rect x="736" y="156" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="764" y="165" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEBSOCKET</text>
        <rect x="724" y="184" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="764" y="193" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIO+CONTROL</text>
        <rect x="736" y="352" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="764" y="361" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEBSOCKET</text>
        <rect x="732" y="380" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="764" y="389" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SOLO AUDIO</text>
        <rect x="724" y="420" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="764" y="429" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESL · CONTROL</text>
        <rect x="1018" y="264" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1032" y="273" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API</text>
        <rect x="602" y="482" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="642" y="491" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRANSFERENCIA</text>

        <!-- Nota editorial: la asimetría -->
        <path d="M 838,500 Q 832,460 824,418" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="824" cy="416" r="2" fill="#2d3142"/>
        <text x="724" y="520" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">FreeSWITCH solo envía audio por el WebSocket:</text>
        <text x="724" y="540" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">la voz del bot, interrumpir y colgar van por ESL.</text>

        <!-- Nodos -->
        <rect x="40" y="252" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="252" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="260" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="269" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEL</text>
        <text x="104" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quien llama</text>
        <text x="104" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">red pública</text>
        <rect x="232" y="252" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="252" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="240" y="260" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="254" y="269" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="304" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operador SIP</text>
        <text x="304" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">troncal + número</text>
        <rect x="504" y="136" width="180" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="136" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="512" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="526" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PBX</text>
        <text x="594" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Asterisk</text>
        <text x="594" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chan_websocket</text>
        <rect x="504" y="352" width="180" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="352" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="512" y="360" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="526" y="369" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PBX</text>
        <text x="594" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FreeSWITCH</text>
        <text x="594" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mod_audio_stream</text>
        <rect x="844" y="136" width="160" height="296" rx="6" fill="#f5f5f5"/>
        <rect x="844" y="136" width="160" height="296" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="852" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="866" y="153" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOT</text>
        <text x="924" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bot Pipecat</text>
        <text x="924" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agente de voz</text>
        <text x="856" y="179" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">/ws/asterisk</text>
        <text x="856" y="375" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">/ws/freeswitch</text>
        <text x="856" y="415" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">cliente ESL</text>
        <rect x="1060" y="252" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="1060" y="252" width="180" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="1068" y="260" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="1082" y="269" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="1150" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Servicios de voz y LLM</text>
        <text x="1150" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Deepgram · Claude · Cartesia</text>
        <rect x="504" y="520" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="520" width="180" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="512" y="528" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="526" y="537" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPC</text>
        <text x="594" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agentes humanos</text>
        <text x="594" y="572" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">destino de transferencia</text>

        <!-- Leyenda -->
        <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>
        <rect x="40" y="684" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Bot (foco)</text>
        <rect x="140" y="684" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Centralita</text>
        <rect x="240" y="684" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>

        <rect x="428" y="684" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="448" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Opcional</text>
        <line x1="516" y1="690" x2="544" y2="690" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="552" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada / WebSocket</text>

      </svg>
    </div>
  </div>
</body>
</html>
